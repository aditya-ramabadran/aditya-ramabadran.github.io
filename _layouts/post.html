---
layout: default
---

<article class="post">
  <a class="back-link" href="{{ '/writing/' | relative_url }}">← All writing</a>
  <header class="post-header">
    <p class="eyebrow">{{ page.format | default: "Note" }}</p>
    <h1>{{ page.title }}</h1>
    <div class="post-meta-row">
      <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}</p>
      {% if page.external_url %}
        <a class="post-external-link" href="{{ page.external_url }}">Read on X <span aria-hidden="true">↗</span></a>
      {% endif %}
    </div>
  </header>
  {% if page.hero_image %}
    <figure class="post-hero">
      <img src="{{ page.hero_image | relative_url }}" alt="{{ page.hero_alt }}">
    </figure>
  {% endif %}
  <div class="post-body">
    {{ content }}
  </div>
</article>
