<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
    <script>
      (function () {
        var saved = localStorage.getItem("theme");
        var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = saved || (dark ? "dark" : "light");
      }());
    </script>
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% feed_meta %}
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <div class="shell">
      <header class="sidebar">
        <div class="profile-photo">
          <img src="{{ '/assets/images/aditya-profile.png' | relative_url }}" alt="Aditya Ramabadran">
        </div>
        <a class="site-name" href="{{ '/' | relative_url }}">Aditya<br>Ramabadran</a>

        <nav class="site-nav" aria-label="Primary navigation">
          <a {% if page.url == '/' %}aria-current="page"{% endif %} href="{{ '/' | relative_url }}">About</a>
          <a {% if page.url == '/writing/' %}aria-current="page"{% endif %} href="{{ '/writing/' | relative_url }}">Writing</a>
          <a class="social-link social-link--first" rel="me" href="https://x.com/a_ramabadran">
            <span class="social-icon social-icon--x" aria-hidden="true"></span>
            <span>X / Twitter</span>
          </a>
          <a class="social-link" href="https://github.com/aditya-ramabadran">
            <span class="social-icon social-icon--github" aria-hidden="true"></span>
            <span>GitHub</span>
          </a>
          <a class="social-link" href="https://www.linkedin.com/in/aditya-ramabadran/">
            <span class="social-icon social-icon--linkedin" aria-hidden="true"></span>
            <span>LinkedIn</span>
          </a>
        </nav>

        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme">
          <span data-theme-label>Dark mode</span>
        </button>
      </header>

      <main id="content" class="content">
        {{ content }}
        <footer class="site-footer">
          <span>© {{ site.time | date: '%Y' }} Aditya Ramabadran</span>
        </footer>
      </main>
    </div>
    <script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
  </body>
</html>
